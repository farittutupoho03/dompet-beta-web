<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dompet Beta — Catatan Keuangan</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin:0; padding:0; height:100%; width:100%; overflow:hidden; background:#0F6B4C; }
  iframe { border:none; width:100%; height:100%; display:block; }
  .loading {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:#0F6B4C; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px; z-index:2;
  }
  .loading .dot { width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; font-weight:800; animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
</style>
</head>
<body>
  <div class="loading" id="loadingMsg">
    <div class="dot">Rp</div>
    <div>Memuat Dompet Beta…</div>
  </div>

  <!--
    PENTING: https://script.google.com/macros/s/AKfycbwByPOAuE1L-aesqwEmh8_PepA0u3F_f0_PPnGdtE45XYqMOc3KZeSDb3ceapQ27xG7cg/exec
  -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwByPOAuE1L-aesqwEmh8_PepA0u3F_f0_PPnGdtE45XYqMOc3KZeSDb3ceapQ27xG7cg/exec"
    title="Dompet Beta"
    allow="clipboard-write"
    onload="document.getElementById('loadingMsg').style.display='none'">
  </iframe>
</body>
</html>
